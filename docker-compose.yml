services:
  yapi:
    image: jayfong/yapi:latest
    container_name: yapi
    environment:
      - YAPI_ADMIN_ACCOUNT=admin@admin.com
      - YAPI_ADMIN_PASSWORD=admin123
      - YAPI_DB_SERVERNAME=mongo
      - YAPI_DB_PORT=27017
      - YAPI_DB_DATABASE=yapi
      - YAPI_DB_USER=
      - YAPI_DB_PASS=
      - YAPI_MAIL_ENABLE=false
      - YAPI_LDAP_LOGIN_ENABLE=false
      - YAPI_CLOSE_REGISTER=true
    ports:
      - "3100:3000"
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:4.4
    container_name: yapi-mongo
    restart: always
    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=shop_user_srv
      - MYSQL_USER=shop_user
      - MYSQL_PASSWORD=shop123456
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis-data:/data

  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    restart: always
    ports:
      - "18500:8500"   # HTTP API & Web UI (映射到 18500，避开 Windows 保留端口)
      # 8300/8301/8302 集群 gossip 端口容器内部通信即可，单机无需对外暴露
      - "18600:8600/udp" # DNS (可选)
      - "18600:8600/tcp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config

volumes:
  mongo-data:
  mysql-data:
  redis-data:
  consul-data:
  consul-config:
