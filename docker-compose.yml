services:
  yapi:
    image: jayfong/yapi:latest
    container_name: yapi
    environment:
      - YAPI_ADMIN_ACCOUNT=admin@admin.com
      - YAPI_ADMIN_PASSWORD=admin123
      - YAPI_DB_SERVERNAME=mongo
      - YAPI_DB_PORT=27017
      - YAPI_DB_DATABASE=yapi
      - YAPI_DB_USER=
      - YAPI_DB_PASS=
      - YAPI_MAIL_ENABLE=false
      - YAPI_LDAP_LOGIN_ENABLE=false
      - YAPI_CLOSE_REGISTER=true
    ports:
      - "8765:3000"
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:4.4
    container_name: yapi-mongo
    restart: always
    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=shop_user_srv
      - MYSQL_USER=shop_user
      - MYSQL_PASSWORD=shop123456
    ports:
      - "3306:3306"
    restart: always
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化时自动创建 nacos_config 库并导入表结构。
      # 注意：该目录下的脚本仅在 MySQL 数据目录为空（首次启动）时执行；
      # 若已有数据卷，需先 `docker compose down -v` 清空或手动执行 ./sql/00-nacos-init.sql。
      - ./sql/00-nacos-init.sql:/docker-entrypoint-initdb.d/00-nacos-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: nacos
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      # 关闭内置 Derby，使用外置 MySQL 持久化
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=root123456
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
      # 鉴权（Nacos 2.4 默认开启鉴权，必须显式配置）
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"   # Web 控制台 & HTTP API
      - "9848:9848"   # gRPC 客户端端口（Nacos 2.x 客户端必用）
      - "9849:9849"   # gRPC 集群内部通信（单机可不开，保留便于排错）
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - nacos-logs:/home/nacos/logs

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      # 宿主机 16379（避开 Windows 排除端口 6365-6464）→ 容器内仍 6379
      - "16379:6379"
    restart: always
    volumes:
      - redis-data:/data

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-init
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 3000:3000 /namesrv-logs /broker-logs /broker-store /proxy-logs"]
    volumes:
      - rocketmq-namesrv-logs:/namesrv-logs
      - rocketmq-broker-logs:/broker-logs
      - rocketmq-broker-store:/broker-store
      - rocketmq-proxy-logs:/proxy-logs
    restart: "no"

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-namesrv
    restart: always
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-broker
    restart: always
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -server -Xms512m -Xmx512m -Xmn256m
    ports:
      # Windows reserves the default 10909/10911 ports on this development machine.
      - "11009:11009"
      - "11011:11011"
    volumes:
      - ./docker/rocketmq:/home/rocketmq/conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/11011'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rocketmq-proxy:
    image: apache/rocketmq:5.3.2
    container_name: rocketmq-proxy
    restart: always
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    command: sh mqproxy -n rocketmq-namesrv:9876 -pm cluster -pc /home/rocketmq/conf/proxy.json
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -server -Xms256m -Xmx512m -Xmn128m
    ports:
      # Windows reserves the default 8080/8081 ports on this development machine.
      - "18080:18080"
      - "18081:18081"
    volumes:
      - ./docker/rocketmq:/home/rocketmq/conf:ro
      - rocketmq-proxy-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18081'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    restart: always
    ports:
      - "18500:8500"   # HTTP API & Web UI (映射到 18500，避开 Windows 保留端口)
      # 8300/8301/8302 集群 gossip 端口容器内部通信即可，单机无需对外暴露
      - "18600:8600/udp" # DNS (可选)
      - "18600:8600/tcp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data -config-dir=/consul/config
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config

  elasticsearch:
    # 自构建镜像：官方 ES + IK 中文分词插件（见 docker/elasticsearch/Dockerfile）
    build:
      context: ./docker/elasticsearch
    image: shop/elasticsearch:8.15.0-ik
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - cluster.name=shop-es
      # “关闭防火墙”：禁用 xpack 安全层（认证 + TLS），开发环境免密直连 9200。
      # 生产务必重新开启并配置 TLS/密码。
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"   # HTTP API（无认证）
      - "9300:9300"   # 节点间 transport（单机可不暴露，保留便于排错）
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      # 直连 ES（ES 侧已关安全层，这里用 http 明文 + 免密）
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - I18N_LOCALE=zh-CN
    ports:
      - "5601:5601"   # Kibana Web UI（免登录）
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  mysql-data:
  redis-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  rocketmq-proxy-logs:
  consul-data:
  consul-config:
  nacos-logs:
  es-data:
