brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
listenPort=21011

# Keep local messages for two days and clean expired files at 04:00.
deleteWhen=04
fileReservedTime=48

brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# Reachable from both Windows-host services and other Docker containers.
brokerIP1=host.docker.internal
