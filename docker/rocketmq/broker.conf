brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
listenPort=11011

# Keep local messages for two days and clean expired files at 04:00.
deleteWhen=04
fileReservedTime=48

brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# Services in this repository run on the Windows host during development.
# Advertise the published Docker port instead of the container-only address.
brokerIP1=127.0.0.1
